name: Semgrep SAST

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep scan
        run: |
          semgrep scan --config auto . --exclude .venv --exclude instance --json -o semgrep-results.json
          semgrep scan --config auto . --exclude .venv --exclude instance --text -o semgrep-results.txt

      - name: Build summary report
        if: always()
        run: |
          python semgrep_report.py semgrep-results.json > semgrep_report.md
          cat semgrep_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: |
            semgrep-results.json
            semgrep-results.txt
            semgrep_report.md
