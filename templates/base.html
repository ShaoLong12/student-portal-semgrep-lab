<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Student Portal{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head><body>
<header><a class="brand" href="{{ url_for('home') }}">Student Portal</a>
{% if g.user %}<nav>
{% if g.user.role == 'student' %}<a href="{{ url_for('grades') }}">Grades</a><a href="{{ url_for('assignments') }}">Assignments</a>{% else %}<a href="{{ url_for('submissions') }}">Submissions</a><a href="{{ url_for('message_new') }}">New message</a>{% endif %}
<a href="{{ url_for('messages') }}">Messages</a><a href="{{ url_for('profile') }}">Profile</a><a href="{{ url_for('change_password') }}">Password</a>
<form class="inline" method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="linklike" type="submit">Sign out ({{ g.user.username }})</button></form></nav>{% endif %}</header>
<main>{% for m in get_flashed_messages() %}<div class="msg">{{ m }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
