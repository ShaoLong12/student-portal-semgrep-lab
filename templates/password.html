{% extends "base.html" %}{% block title %}Change password{% endblock %}{% block content %}<div class="card"><h1>Change password</h1>
<form method="post" novalidate><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Current password <input type="password" name="current" autocomplete="current-password" maxlength="128" required></label>
<label>New password (12+ characters) <input type="password" name="new" autocomplete="new-password" maxlength="128" required></label>
<label>Repeat new password <input type="password" name="again" autocomplete="new-password" maxlength="128" required></label>
<p><button class="btn" type="submit">Change password</button></p></form></div>{% endblock %}
