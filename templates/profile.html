{% extends "base.html" %}{% block title %}Profile{% endblock %}{% block content %}<div class="card"><h1>My profile</h1><p class="muted">{{ u.full_name }} ({{ u.username }})</p>
<form method="post" novalidate><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Email <input type="email" name="email" value="{{ u.email }}" maxlength="254" required></label>
<label>Phone <input name="phone" value="{{ u.phone }}" maxlength="20"></label>
<label>Address <input name="address" value="{{ u.address }}" maxlength="200"></label>
<label>Current password (required to save changes) <input type="password" name="current_password" autocomplete="current-password" maxlength="128" required></label>
<p><button class="btn" type="submit">Save</button></p></form></div>{% endblock %}
